<script>
  // No backend here — we read purchased item ids from the success URL
  // (set in js/stripe-checkout.js) just to show a friendly summary.
  // This is NOT a verified/secure record of payment — see the note in
  // js/stripe-checkout.js if you need protected digital delivery later.
  const params = new URLSearchParams(window.location.search);
  const items = (params.get("items") || "").split(",").filter(Boolean);

  if (items.length){
    const box = document.getElementById("orderSummary");
    const lines = document.getElementById("orderLines");
    box.style.display = "block";
    lines.innerHTML = items.map(id => {
      const p = getProductById(id);
      if (!p) return "";
      return `<div style="display:flex;justify-content:space-between;padding:6px 0;font-weight:600;font-size:14px;">
        <span>${p.icon || ""} ${p.title}</span><span>$${p.price.toFixed(2)}</span>
      </div>`;
    }).join("");
  }

  // Clear the cart now that checkout is complete.
  localStorage.removeItem("gmt_cart_v1");
</script>
